<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Para Salomé ❤️</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #ffe6e6;
            color: #d63384;
            overflow: hidden; /* Evita scroll mientras juegas */
            touch-action: none; /* Mejora la respuesta táctil */
        }
        h1 { margin: 10px 0; font-size: 1.5rem; text-align: center; }
        p { margin-bottom: 15px; text-align: center; font-size: 0.9rem; px: 20px;}
        
        #game-area {
            position: relative;
            width: 306px; /* 300px + bordes */
            height: 306px;
        }

        #puzzle-container {
            width: 300px;
            height: 300px;
            position: relative;
            background-color: #ddd;
            border: 3px solid #fff;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            border-radius: 10px;
            overflow: hidden;
        }

        .tile {
            width: 98px; /* Un poco menos de 100 para dejar hueco visual */
            height: 98px;
            position: absolute;
            background-image: url('foto.png'); /* TU FOTO AQUÍ */
            background-size: 300px 300px;
            cursor: pointer;
            transition: transform 0.2s ease-in-out;
            border-radius: 5px;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
        }

        /* Mensaje final */
        #message {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
            z-index: 10;
            width: 80%;
        }

        button {
            margin-top: 25px;
            padding: 12px 24px;
            font-size: 16px;
            background-color: #d63384;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>Para ti, Salomé, la más guapa</h1>
    <p>Desliza las piezas para armar la foto ❤️</p>

    <div id="game-area">
        <div id="puzzle-container"></div>
        
        <div id="message">
            <h2>¡ouaissss Saloméeeee! 🎉</h2>
            <p>Eres mi pieza favorita.</p>
            <p>Te amo mi amor❤️.</p>
        </div>
    </div>

    <button onclick="shufflePuzzle()">Revolver de nuevo</button>

    <script>
        const container = document.getElementById('puzzle-container');
        const message = document.getElementById('message');
        const size = 3; // 3x3
        const tileSize = 100;
        let tiles = []; // Guardará el estado lógico del tablero [0, 1, 2, ..., 8] (8 es vacío)

        // Inicializar
        function initGame() {
            tiles = [0, 1, 2, 3, 4, 5, 6, 7, 8];
            render();
            setTimeout(shufflePuzzle, 1000);
        }

        // Dibujar las piezas en su posición actual
        function render() {
            container.innerHTML = '';
            tiles.forEach((tileIndex, positionIndex) => {
                if (tileIndex === 8) return; // No dibujar la pieza vacía

                const div = document.createElement('div');
                div.classList.add('tile');
                
                // Posición actual en el tablero (visual)
                const currentX = (positionIndex % size) * tileSize;
                const currentY = Math.floor(positionIndex / size) * tileSize;
                
                div.style.left = currentX + 'px';
                div.style.top = currentY + 'px';

                // Qué parte de la imagen mostrar (background)
                const bgX = (tileIndex % size) * tileSize;
                const bgY = Math.floor(tileIndex / size) * tileSize;
                div.style.backgroundPosition = `-${bgX}px -${bgY}px`;

                // Eventos para Mouse y Touch
                div.addEventListener('click', () => tryMove(positionIndex));
                div.addEventListener('touchstart', (e) => handleTouchStart(e, positionIndex), {passive: false});
                div.addEventListener('touchend', (e) => handleTouchEnd(e, positionIndex));

                container.appendChild(div);
            });
        }

        // Intentar mover pieza (Click o Swipe)
        function tryMove(index) {
            const emptyIndex = tiles.indexOf(8);
            const row = Math.floor(index / size);
            const col = index % size;
            const emptyRow = Math.floor(emptyIndex / size);
            const emptyCol = emptyIndex % size;

            // Verificar si está en la misma fila o columna que el hueco
            if (row === emptyRow) {
                // Mover horizontalmente (puede ser más de una pieza)
                if (col < emptyCol) {
                    for (let i = emptyCol - 1; i >= col; i--) swap(i + row * size, (i + 1) + row * size);
                } else if (col > emptyCol) {
                    for (let i = emptyCol + 1; i <= col; i++) swap(i + row * size, (i - 1) + row * size);
                }
            } else if (col === emptyCol) {
                // Mover verticalmente
                if (row < emptyRow) {
                    for (let i = emptyRow - 1; i >= row; i--) swap(col + i * size, col + (i + 1) * size);
                } else if (row > emptyRow) {
                    for (let i = emptyRow + 1; i <= row; i++) swap(col + i * size, col + (i - 1) * size);
                }
            } else {
                return; // No se puede mover
            }
            
            render();
            checkWin();
        }

        // Intercambiar dos posiciones en el array
        function swap(pos1, pos2) {
            const temp = tiles[pos1];
            tiles[pos1] = tiles[pos2];
            tiles[pos2] = temp;
        }

        // --- Lógica Táctil (Swipe) ---
        let startX, startY;

        function handleTouchStart(e, index) {
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;
        }

        function handleTouchEnd(e, index) {
            if (!startX || !startY) return;
            
            const endX = e.changedTouches[0].clientX;
            const endY = e.changedTouches[0].clientY;
            
            const diffX = endX - startX;
            const diffY = endY - startY;

            // Si el deslizamiento fue cortito, cuéntalo como click
            if (Math.abs(diffX) < 10 && Math.abs(diffY) < 10) {
                tryMove(index);
                return;
            }

            // Determinar dirección del swipe
            const emptyIndex = tiles.indexOf(8);
            const row = Math.floor(index / size);
            const col = index % size;
            const emptyRow = Math.floor(emptyIndex / size);
            const emptyCol = emptyIndex % size;

            // Si desliza hacia la dirección del hueco, mover
            if (Math.abs(diffX) > Math.abs(diffY)) {
                // Horizontal
                if (diffX > 0 && row === emptyRow && col < emptyCol) tryMove(index); // Derecha
                if (diffX < 0 && row === emptyRow && col > emptyCol) tryMove(index); // Izquierda
            } else {
                // Vertical
                if (diffY > 0 && col === emptyCol && row < emptyRow) tryMove(index); // Abajo
                if (diffY < 0 && col === emptyCol && row > emptyRow) tryMove(index); // Arriba
            }

            startX = null;
            startY = null;
        }

        // Revolver
        function shufflePuzzle() {
            message.style.display = 'none';
            // Hacemos movimientos aleatorios válidos para asegurar que tenga solución
            // (Simulamos 150 clicks aleatorios)
            let moves = 0;
            const interval = setInterval(() => {
                const emptyIndex = tiles.indexOf(8);
                const neighbors = [];
                const row = Math.floor(emptyIndex / size);
                const col = emptyIndex % size;

                if (row > 0) neighbors.push(emptyIndex - size);
                if (row < size - 1) neighbors.push(emptyIndex + size);
                if (col > 0) neighbors.push(emptyIndex - 1);
                if (col < size - 1) neighbors.push(emptyIndex + 1);

                const randomPos = neighbors[Math.floor(Math.random() * neighbors.length)];
                
                // Swap simple para el shuffle visual
                swap(emptyIndex, randomPos);
                render();
                
                moves++;
                if (moves > 80) clearInterval(interval);
            }, 20); // Velocidad de revolver
        }

        // Verificar victoria
        function checkWin() {
            const isSolved = tiles.every((val, index) => val === index);
            if (isSolved) {
                setTimeout(() => {
                    message.style.display = 'block';
                }, 200);
            }
        }

        initGame();
    </script>
</body>
</html>
