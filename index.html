<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Para Salomé ❤️</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <h1>Para ti, Salomé, la más guapa</h1>
  <p>Desliza las piezas para armar la foto ❤️</p>

  <div class="toolbar">
    <label class="file">
      Cambiar imagen
      <input id="fileInput" type="file" accept="image/*" />
    </label>

    <label class="select">
      Tamaño
      <select id="sizeSelect">
        <option value="3" selected>3x3</option>
        <option value="4">4x4</option>
        <option value="5">5x5</option>
      </select>
    </label>

    <button id="shuffleBtn" type="button">Revolver</button>
  </div>

  <div id="game-area">
    <div id="puzzle-container" aria-label="Puzzle"></div>

    <div id="message" role="dialog" aria-modal="true">
      <h2>¡ouaissss Saloméeeee! 🎉</h2>
      <p>Eres mi pieza favorita.</p>
      <p>Te amo mi amor❤️.</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
